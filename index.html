<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>一页清单</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * {margin: 0;padding: 0;box-sizing: border-box;font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC","Hiragino Sans GB", "Microsoft YaHei", sans-serif;}
    body {min-height: 100vh;background: linear-gradient(135deg, #eef2ff 0%, #f0f9ff 45%, #f5f3ff 100%);color: #1e293b;padding: 24px 16px 40px;}
    .app-shell {max-width: 1120px;margin: 0 auto;}
    .top-bar {display: flex;align-items: center;justify-content: space-between;margin-bottom: 20px;padding: 14px 20px;background: rgba(255, 255, 255, 0.78);border: 1px solid rgba(255, 255, 255, 0.8);border-radius: 18px;box-shadow: 0 10px 30px rgba(59, 130, 246, 0.08);backdrop-filter: blur(10px);position: relative;}
    .brand-center-wrap {position: absolute;left: 50%;transform: translateX(-50%);display: flex;align-items: center;gap: 10px;font-size: 17px;font-weight: 700;color: #475569;}
    .brand-logo {width: 34px;height: 34px;border-radius: 50%;border: 3px solid #475569;display: flex;align-items: center;justify-content: center;color: #475569;font-size: 18px;background: #fff;}
    .brand-logo i {transform: rotate(-20deg);font-weight:900;}
    .user-info {display: flex;align-items: center;gap: 10px;font-size: 14px;color: #475569;margin-left:auto;}
    .avatar {width: 34px;height: 34px;border-radius: 50%;background: linear-gradient(135deg, #38bdf8, #6366f1);color: #fff;display: flex;align-items: center;justify-content: center;font-weight: 700;font-size: 13px;}
    .card {background: rgba(255, 255, 255, 0.82);border: 1px solid rgba(255, 255, 255, 0.9);border-radius: 22px;padding: 24px;box-shadow: 0 18px 45px rgba(71, 85, 105, 0.12);backdrop-filter: blur(14px);}
    .login-card {max-width: 440px;margin: 60px auto 0;padding: 32px;background: rgba(255, 255, 255, 0.86);border: 1px solid rgba(255, 255, 255, 0.9);border-radius: 24px;box-shadow: 0 25px 55px rgba(79, 70, 229, 0.18);backdrop-filter: blur(16px);}
    .login-header {text-align:center;margin-bottom:18px}
    .login-logo-wrap{width:64px;height:64px;border-radius:50%;border:4px solid #475569;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
    .login-logo-wrap i{color:#475569;font-size:32px}
    .login-title {font-size: 24px;font-weight: 800;color: #475569;margin-bottom: 8px;text-align:center;}
    .login-subtitle {color: #64748b;font-size: 14px;margin-bottom: 24px;text-align:center;}
    h2 {font-size: 19px;font-weight: 700;color: #0f172a;margin-bottom: 18px;display: flex;align-items: center;gap: 8px;}
    h2 i {color: #6366f1;}
    h3 {font-size: 16px;font-weight: 700;color: #1e293b;margin: 20px 0 14px;display: flex;align-items: center;gap: 8px;}
    h3 i {color: #7c3aed;font-size: 14px;}
    .form-item {margin-bottom: 16px;}
    label {display: block;margin-bottom: 8px;font-size: 13px;color: #475569;font-weight: 600;}
    input,select,textarea {width: 100%;padding: 12px 14px;border: 1px solid #e2e8f0;border-radius: 14px;font-size: 14px;background: #fff;transition: all 0.25s ease;color: #0f172a;}
    input:focus,select:focus,textarea:focus {outline: none;border-color: #818cf8;background: #fff;box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.18);}
    textarea {resize: vertical;min-height: 100px;line-height: 1.6;}
    button {padding: 11px 18px;border: none;border-radius: 14px;cursor: pointer;font-size: 14px;font-weight: 600;transition: all 0.25s ease;margin: 6px 8px 6px 0;display: inline-flex;align-items: center;gap: 7px;}
    .btn-primary {background: linear-gradient(135deg, #6366f1, #4f46e5);color: #fff;box-shadow: 0 10px 24px rgba(99, 102, 241, 0.35);}
    .btn-primary:hover {transform: translateY(-1px);box-shadow: 0 14px 30px rgba(79, 70, 229, 0.42);}
    .btn-purple {background: linear-gradient(135deg, #a855f7, #7c3aed);color: #fff;box-shadow: 0 10px 24px rgba(139, 92, 246, 0.35);}
    .btn-purple:hover {transform: translateY(-1px);box-shadow: 0 14px 30px rgba(124, 58, 237, 0.42);}
    .btn-teal {background: linear-gradient(135deg, #22d3ee, #06b6d4);color: #fff;box-shadow: 0 10px 24px rgba(34, 211, 238, 0.32);}
    .btn-teal:hover {transform: translateY(-1px);box-shadow: 0 14px 30px rgba(6, 182, 212, 0.4);}
    .btn-success {background: linear-gradient(135deg, #34d399, #10b981);color: #fff;box-shadow: 0 10px 24px rgba(52, 211, 153, 0.32);}
    .btn-success:hover {transform: translateY(-1px);box-shadow: 0 14px 30px rgba(16, 185, 129, 0.4);}
    .btn-gray {background: #f1f5f9;color: #334155;border: 1px solid #e2e8f0;}
    .btn-gray:hover {background: #e2e8f0;}
    .btn-danger {background: linear-gradient(135deg, #f87171, #ef4444);color: #fff;box-shadow: 0 10px 24px rgba(239, 68, 68, 0.32);}
    .btn-warning {background: linear-gradient(135deg, #fbbf24, #f59e0b);color: #fff;box-shadow: 0 10px 24px rgba(245, 158, 11, 0.32);}
    .btn-danger:hover {transform: translateY(-1px);box-shadow: 0 14px 30px rgba(239, 68, 68, 0.4);}
    .row {display: flex;gap: 14px;flex-wrap: wrap;}
    .row .form-item {flex: 1;min-width: 220px;}
    .tip-text {font-size: 12px;color: #64748b;margin: -6px 0 14px;padding-left: 4px;}
    .divider {height: 1px;background: linear-gradient(90deg, transparent, #e2e8f0, transparent);margin: 24px 0;border: none;}
    .tab-bar {display: flex;gap: 4px;margin-bottom: 20px;padding: 8px;background: rgba(255, 255, 255, 0.7);border: 1px solid rgba(255, 255, 255, 0.9);border-radius: 18px;flex-wrap: wrap;align-items:center;}
    .tab {padding: 10px 16px;cursor: pointer;border-radius: 14px;color: #475569;font-weight: 600;font-size: 14px;transition: all 0.25s ease;display: inline-flex;align-items: center;gap: 8px;}
    .tab:hover {background: #f1f5f9;color: #0f172a;}
    .tab.active {background: linear-gradient(135deg, #6366f1, #8b5cf6);color: #fff;box-shadow: 0 10px 24px rgba(139, 92, 246, 0.35);}
    .hidden {display: none !important;}
    .todo-item {border: 1px solid #eef2ff;border-radius: 18px;padding: 18px;margin: 14px 0;background: linear-gradient(145deg, #ffffff, #f8faff);transition: all 0.25s ease;}
    .todo-item:hover {transform: translateY(-2px);box-shadow: 0 18px 40px rgba(99, 102, 241, 0.14);border-color: #e0e7ff;}
    .todo-item.overdue {border-color: #fca5a5;background: linear-gradient(145deg, #fef2f2, #fff1f2);}
    .todo-item.overdue .todo-title strong::after {content: " 已逾期";color: #dc2626;font-size: 12px;background: #fee2e2;padding: 2px 8px;border-radius: 8px;margin-left: 6px;}
    .todo-actions {margin-top: 12px;display: flex;gap: 8px;}
    .todo-actions button {margin: 0;padding: 6px 12px;font-size: 12px;border-radius: 8px;}
    .stat-row {display: grid;grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));gap: 12px;margin-bottom: 20px;}
    .stat-card {background: #fff;border-radius: 16px;padding: 16px;text-align: center;border: 1px solid #eef2ff;}
    .stat-card .num {font-size: 28px;font-weight: 800;margin: 8px 0 4px;}
    .stat-card .label {font-size: 12px;color: #64748b;}
    .stat-total .num {color: #6366f1;}
    .stat-doing .num {color: #f59e0b;}
    .stat-finish .num {color: #10b981;}
    .stat-overdue .num {color: #ef4444;}
    .todo-title {display: flex;align-items: center;gap: 10px;flex-wrap: wrap;margin-bottom: 10px;}
    .todo-title strong {font-size: 16px;color: #0f172a;}
    .meta-row {display: flex;flex-wrap: wrap;gap: 10px;margin-top: 10px;font-size: 13px;color: #475569;}
    .meta-row span {display: inline-flex;align-items: center;gap: 6px;background: #f1f5f9;padding: 6px 10px;border-radius: 10px;}
    .category-tag {background: #eef2ff !important;color: #4f46e5 !important;}
    .priority-high {background: #fef2f2 !important;color: #dc2626 !important;}
    .priority-mid {background: #fff7ed !important;color: #ea580c !important;}
    .priority-low {background: #ecfdf5 !important;color: #059669 !important;}
    .status-wait {background: #f1f5f9 !important;color: #475569 !important;}
    .status-doing {background: #eef2ff !important;color: #4f46e5 !important;}
    .status-finish {background: #ecfdf5 !important;color: #059669 !important;}
    .status-paused {background: #fef3c7 !important;color: #d97706 !important;}
    .summary-block {background: linear-gradient(135deg, #f0f9ff, #eef2ff);border: 1px solid #e0e7ff;border-radius: 20px;padding: 20px;margin-top: 24px;}
    .summary-group {margin: 12px 0;padding: 14px;background: #fff;border-radius: 16px;border: 1px solid #eef2ff;}
    .summary-group strong {color: #4f46e5;}
    .log-item {font-size: 14px;color: #475569;padding: 12px;border-bottom: 1px dashed #e2e8f0;}
    .ai-result {background: #f8fafc;padding: 16px;border-radius: 16px;margin-top: 14px;white-space: pre-wrap;border: 1px solid #e2e8f0;line-height: 1.7;}
    .category-block {border: 1px solid #e2e8f0;border-radius: 16px;padding: 14px 16px;margin: 12px 0;display: flex;gap: 12px;align-items: center;justify-content: space-between;background: #fff;}
    .filter-bar {background: rgba(255, 255, 255, 0.7);padding: 16px;border-radius: 18px;margin-bottom: 20px;border: 1px solid rgba(255, 255, 255, 0.9);}
    .login-tip {color: #dc2626;margin-top: 14px;font-size: 14px;text-align: center;min-height:20px}
    .combo-wrap {position: relative;width: 100%;}
    .combo-input {width: 100%;padding: 12px 14px;border: 1px solid #e2e8f0;border-radius: 14px;font-size: 14px;background: #fff;transition: all 0.25s ease;}
    .combo-input:focus {outline: none;border-color: #818cf8;box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.18);}
    .combo-dropdown {position: absolute;top: calc(100% + 6px);left: 0;right: 0;background: #fff;border: 1px solid #e2e8f0;border-radius: 16px;box-shadow: 0 18px 40px rgba(71, 85, 105, 0.18);max-height: 240px;overflow-y: auto;z-index: 99;}
    .combo-item {padding: 12px 14px;cursor: pointer;font-size: 14px;color: #334155;display:flex;align-items:center;justify-content:space-between;}
    .combo-item:hover {background: #eef2ff;color: #4f46e5;}
    .combo-item.is-custom {color:#7c3aed;font-style:italic;}
    .combo-select-box {width:100%;padding:12px 14px;border:1px solid #e2e8f0;border-radius:14px;background:#fff;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#0f172a;transition:all 0.25s ease;}
    .combo-select-box:hover {border-color:#818cf8;}
    .combo-select-box.placeholder {color:#94a3b8;}
    .combo-select-box i {color:#94a3b8;font-size:12px;}
    .perm-dropdown-wrap{position:relative;width:100%;max-width:360px}
    .perm-select-box{width:100%;padding:10px 14px;border:1px solid #e2e8f0;border-radius:14px;background:#fff;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
    .perm-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,0.1);z-index:99;max-height:220px;overflow-y:auto;padding:6px;}
    .perm-item{padding:8px 10px;display:flex;gap:10px;align-items:center;cursor:pointer;border-radius:8px;}
    .perm-item:hover{background:#eef2ff;}
    .perm-item input[type="checkbox"]{width:16px;height:16px;margin:0;cursor:pointer;}
    .perm-item label{margin:0;cursor:pointer;font-size:14px;color:#334155;}
    .perm-tag{display:inline-block;background:#eef2ff;color:#4f46e5;border-radius:8px;padding:4px 8px;font-size:12px;margin:2px;}
    .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:1000;display:none;align-items:center;justify-content:center;}
    .modal-box{background:#fff;border-radius:20px;width:90%;max-width:520px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,0.15)}
    .modal-overlay.show{display:flex;}
    .admin-mail-send-block{background:#eef2ff;padding:18px;border-radius:18px;margin-top:20px;border:1px solid #c7d2fe;}
    .edit-banner{background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #f59e0b;color:#92400e;padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;}
    .edit-banner button{margin:0;padding:4px 10px;font-size:12px;}
    @media (max-width: 720px) {
      body {padding: 14px 10px 30px;}
      .card,.login-card {padding: 18px;border-radius: 18px;}
      .tab {padding: 9px 13px;font-size: 13px;}
      button {width: 100%;justify-content: center;margin: 6px 0;}
      .row {flex-direction: column;}
      .brand-center-wrap{position:relative;left:unset;transform:none;margin:0 auto;}
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="top-bar">
      <div class="brand-center-wrap">
        <div class="brand-logo"><i class="fa-solid fa-check"></i></div>一页清单
      </div>
      <div class="user-info" id="user-info" style="display:none">
        <div class="avatar" id="user-avatar">A</div>
        <span id="user-name">admin</span>
      </div>
    </div>
    <div id="page-login" class="login-card">
      <div class="login-header">
        <div class="login-logo-wrap"><i class="fa-solid fa-check"></i></div>
        <h2 class="login-title">一页清单</h2>
        <div class="login-subtitle">登录你的待办管理系统</div>
      </div>
      <div class="form-item">
        <label><i class="fa-regular fa-user"></i> 账号</label>
        <input id="login-user" placeholder="请输入账号">
      </div>
      <div class="form-item">
        <label><i class="fa-solid fa-lock"></i> 密码</label>
        <input id="login-pwd" type="password" placeholder="请输入密码">
      </div>
      <button id="login-btn" class="btn-primary" style="width:100%;justify-content:center">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> 登录
      </button>
      <div id="login-tip" class="login-tip"></div>
      <div style="text-align:center;margin-top:14px;font-size:13px;color:#6366f1">
        还没有账号？<a href="javascript:void(0)" id="show-register-link" style="color:#6366f1;font-weight:600;cursor:pointer">立即注册</a>
      </div>
    </div>
    <div id="page-main" class="hidden">
      <div class="card">
        <div class="tab-bar" id="tabBarContainer">
          <button id="logout-btn" class="btn-gray"><i class="fa-solid fa-right-from-bracket"></i> 退出登录</button>
        </div>
        <div id="tab-todo">
          <div id="edit-banner" class="edit-banner hidden">
            <span><i class="fa-solid fa-pen-to-square"></i> 正在编辑待办记录，修改后点击"保存修改"</span>
            <button class="btn-gray" id="btn-cancel-edit"><i class="fa-solid fa-xmark"></i> 取消编辑</button>
          </div>
          <h2><i class="fa-solid fa-circle-plus"></i> 新增待办</h2>
          <div class="form-item" id="assign-wrap" style="display:none">
            <label>指派给（管理员可用）</label>
            <select id="assign-user"></select>
          </div>
          <div class="form-item">
            <label>工作事项（选择具体工作项）</label>
            <div class="combo-wrap">
              <div id="category-select-box" class="combo-select-box">
                <span id="category-select-text">请选择工作事项</span>
                <i class="fa-solid fa-chevron-down"></i>
              </div>
              <div id="category-combo-dropdown" class="combo-dropdown hidden" style="max-height:320px"></div>
            </div>
          </div>
          <div class="form-item">
            <label>优先级</label>
            <div class="combo-wrap">
              <div id="priority-select-box" class="combo-select-box">
                <span id="priority-select-text">🟠 中优先级</span>
                <i class="fa-solid fa-chevron-down"></i>
              </div>
              <div id="priority-combo-dropdown" class="combo-dropdown hidden" style="max-height:none"></div>
            </div>
            <input type="hidden" id="todo-priority" value="mid">
          </div>
          <div class="form-item">
            <label>任务状态</label>
            <select id="todo-status">
              <option value="wait">⏸ 未开始</option>
              <option value="doing">▶ 进行中</option>
              <option value="finish">✅ 已完成</option>
            </select>
          </div>
          <div class="form-item">
            <label>备注信息</label>
            <textarea id="todo-note" placeholder="填写工作简述，可基于备注生成工作汇报"></textarea>
            <button id="btn-ai-note" class="btn-purple" style="margin-top:10px"><i class="fa-solid fa-wand-magic-sparkles"></i> 优化备注</button>
          </div>
          <div class="tip-text"><i class="fa-regular fa-lightbulb"></i> 时间格式：XXXX/XX/XX XX:XX｜选中时间框后按 Ctrl+;（Mac用 ⌘+;）自动填充当前时间</div>
          <div class="row">
            <div class="form-item"><label>开始时间（选填）</label><input id="todo-start" placeholder="例如：2026/09/20 08:30" /></div>
            <div class="form-item"><label>完成时间</label><input id="todo-end" placeholder="完成后填写" /></div>
          </div>
          <button id="btn-add-todo" class="btn-primary"><i class="fa-solid fa-plus"></i> 添加待办记录</button>
          <button id="btn-gen-report" class="btn-purple"><i class="fa-solid fa-file-lines"></i> 生成日报文本</button>
          <button id="btn-export" class="btn-teal"><i class="fa-solid fa-calendar-days"></i> 导出日报（选日期）</button>
          <div id="ai-output" class="ai-result hidden"></div>
          <hr class="divider" />
          <div class="filter-bar">
            <h3 style="margin-top:0"><i class="fa-solid fa-filter"></i> 任务筛选</h3>
            <div class="row">
              <div class="form-item">
                <label>任务状态</label>
                <select id="filter-status">
                  <option value="">全部状态</option>
                  <option value="wait">未开始</option>
                  <option value="doing">进行中</option>
                  <option value="finish">已完成</option>
                  <option value="overdue">已逾期</option>
                </select>
              </div>
              <div class="form-item">
                <label>优先级</label>
                <select id="filter-priority">
                  <option value="">全部优先级</option>
                  <option value="high">🔴 高优先级</option>
                  <option value="mid">🟠 中优先级</option>
                  <option value="low">🟢 低优先级</option>
                </select>
              </div>
              <div class="form-item">
                <label>工作项筛选</label>
                <select id="filter-category"><option value="">全部工作项</option></select>
              </div>
            </div>
            <button id="btn-filter" class="btn-primary"><i class="fa-solid fa-magnifying-glass"></i> 筛选任务</button>
            <button id="btn-reset-filter" class="btn-gray"><i class="fa-solid fa-rotate-right"></i> 重置筛选</button>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
            <h2 style="margin:0"><i class="fa-solid fa-clipboard-list"></i> 当日明细记录</h2>
            <div style="display:flex;align-items:center;gap:8px;white-space:nowrap">
              <label style="font-size:13px;color:#64748b">筛选日期：</label>
              <input type="date" id="filter-date" style="padding:6px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px">
              <button id="btn-clear-date" class="btn-gray" style="padding:6px 10px;font-size:12px;display:none">清除筛选</button>
              <span id="list-total-min" style="font-size:15px;color:#6366f1;font-weight:700;background:#eef2ff;padding:6px 14px;border-radius:10px;margin-left:4px"></span>
            </div>
          </div>
          <div id="todo-list"></div>
          <div class="summary-block">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <h2 style="margin-top:0"><i class="fa-solid fa-chart-simple"></i> 当日大类汇总统计</h2>
              <span id="total-min-display" style="font-size:18px;color:#6366f1;font-weight:700;background:#eef2ff;padding:8px 18px;border-radius:12px"></span>
            </div>
            <div id="summary-list"></div>
          </div>
        </div>
        <div id="tab-alltodo" class="hidden"><h2><i class="fa-solid fa-users-line"></i> 全员待办任务查看</h2><div id="all-todo-list"></div></div>
        <div id="tab-category" class="hidden">
          <h2><i class="fa-solid fa-folder-tree"></i> 大类管理</h2>
          <div class="form-item"><label>新增大类名称</label><input id="new-category-name" placeholder="输入自定义大类名称，例如：测试工作" /></div>
          <button id="btn-add-cat" class="btn-primary"><i class="fa-solid fa-plus"></i> 添加大类</button>
          <div id="category-list"></div>
        </div>

// ============ 工具函数 ============
function esc(str){
  if(str==null) return "";
  return String(str).replace(/[&<>"']/g, s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
}
function getNowTimeStr(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  const h=String(d.getHours()).padStart(2,"0");
  const min=String(d.getMinutes()).padStart(2,"0");
  return `${y}/${m}/${day} ${h}:${min}`;
}
function parseTime(s){
  if(!s) return NaN;
  const t=new Date(String(s).replace(/\//g,"-"));
  return t.getTime();
}
// 全局逾期判断：没完成（进行中或暂停），且开始时间 < 今天0点
function isItemOverdue(x){
  if(x.status === "finish" || x.status === "wait") return false;
  const st = parseTime(x.startTime);
  const todayStart = new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate()).getTime();
  return !isNaN(st) && st < todayStart;
}

function genTodoId(){
  if(!data.nextTodoId) data.nextTodoId = 1;
  // 兼容旧数据：如果已有todo的id比nextTodoId大，从最大id+1开始
  const maxId = data.todos.reduce((m,t)=>Math.max(m, typeof t.id==="number"?Math.floor(t.id):0), 0);
  data.nextTodoId = Math.max(data.nextTodoId, maxId+1);
  return data.nextTodoId++;
}
function saveData(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  if(data.cloudConfig?.binId && data.cloudConfig?.apiKey){
    fetch(`https://api.jsonbin.io/v3/b/${data.cloudConfig.binId}`,{
      method:"PUT",
      headers:{ "Content-Type":"application/json", "X-Master-Key": data.cloudConfig.apiKey },
      body: JSON.stringify(data)
    }).catch(e=>console.log("云端同步失败:",e));
  }
}
async function fetchCloudData(){
  if(!data.cloudConfig?.binId || !data.cloudConfig?.apiKey) return;
  try{
    const resp = await fetch(`https://api.jsonbin.io/v3/b/${data.cloudConfig.binId}/latest?t=${Date.now()}`,{
      headers:{ "X-Master-Key": data.cloudConfig.apiKey, "Cache-Control": "no-cache" }
    });
    const result = await resp.json();
    if(result.record){
      data = result.record;
      localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
      console.log("云端数据同步成功");
    }
  }catch(e){ console.log("云端拉取失败:",e); }
}

document.addEventListener("click",function(e){
  const target = e.target;
  // 删除成员
  if(target.classList.contains("btn-del-member")){
    const un = target.dataset.user;
    if(confirm(`确认删除成员【${un}】？`)){
      data.users = data.users.filter(u=>u.username!==un);
      saveData(); renderMemberList();
    }
    return;
  }
  // 删除大类
  if(target.classList.contains("btn-del-cat")){
    const cname = target.dataset.catname;
    if(confirm(`确认删除大类【${cname}】`)){
      data.categories = data.categories.filter(c=>c.name!==cname);
      saveData(); renderCategoryList();
    }
    return;
  }
  // tab 切换
  if(target.classList.contains("tab")){ switchTab(target.dataset.tab); return; }
  // 权限下拉展开/收起
  if(target.classList.contains("perm-select-box")){
    const wrap = target.closest(".perm-dropdown-wrap");
    const drop = wrap.querySelector(".perm-dropdown");
    drop.classList.toggle("hidden");
    return;
  }
  if(!target.closest(".perm-dropdown-wrap")){
    document.querySelectorAll(".perm-dropdown").forEach(d=>d.classList.add("hidden"));
  }
  // 编辑待办
  if(target.classList.contains("btn-edit-todo")){
    const id = Number(target.dataset.id);
    const todo = data.todos.find(t=>Number(t.id)===id);
    if(!todo) return;
    fillFormForEdit(todo);
    return;
  }
  // 开始待办（从未开始变进行中，自动填开始时间）
  if(target.classList.contains("btn-start-todo")){
    const id = Number(target.dataset.id);
    const todo = data.todos.find(t=>Number(t.id)===id);
    if(!todo) return;
    todo.status = "doing";
    todo.startTime = getNowTimeStr();
    saveData();
    renderTodoList();
    return;
  }
  // 暂停待办（累计时长，清空开始时间）
  if(target.classList.contains("btn-pause-todo")){
    const id = Number(target.dataset.id);
    const todo = data.todos.find(t=>Number(t.id)===id);
    if(!todo) return;
    const t1 = parseTime(todo.startTime);
    const t2 = Date.now();
    if(!isNaN(t1)){
      const mins = Math.round((t2-t1)/60000);
      todo.useMin = (todo.useMin||0) + mins;
    }
    todo.status = "paused";
    // 保留startTime用于逾期判断，继续时会覆盖
    saveData();
    renderTodoList();
    return;
  }
  // 继续待办（从暂停恢复进行中，重新计开始时间）
  if(target.classList.contains("btn-resume-todo")){
    const id = Number(target.dataset.id);
    const todo = data.todos.find(t=>Number(t.id)===id);
    if(!todo) return;
    todo.status = "doing";
    todo.startTime = getNowTimeStr();
    saveData();
    renderTodoList();
    return;
  }
  // 完成待办
  if(target.classList.contains("btn-complete-todo")){
    const id = Number(target.dataset.id);
    const todo = data.todos.find(t=>Number(t.id)===id);
    if(!todo) return;
    // 如果当前是doing状态，先累计最后一段时长
    if(todo.status === "doing"){
      const t1 = parseTime(todo.startTime);
      const t2 = Date.now();
      if(!isNaN(t1)){
        const mins = Math.round((t2-t1)/60000);
        todo.useMin = (todo.useMin||0) + mins;
      }
      todo.startTime = "";
    }
    todo.status = "finish";
    todo.endTime = getNowTimeStr();
    saveData();
    renderTodoList();
    return;
  }
  // 统计卡片点击筛选
  if(target.classList.contains("stat-filter-card")){
    const f = target.dataset.filter;
    window._statFilter = (window._statFilter === f) ? "" : f; // 再点取消
    renderTodoList();
    return;
  }
  // 删除待办
  if(target.classList.contains("btn-del-todo")){
    const id = Number(target.dataset.id);
    if(!confirm("确认删除这个待办？")) return;
    data.todos = data.todos.filter(t=>Number(t.id)!==id);
    saveData(); renderTodoList();
    return;
  }
});

async function aiImproveNote(){
  const inp = document.getElementById("todo-note");
  const txt = inp.value.trim();
  if(!txt){ alert("请输入备注草稿"); return; }
  const btn = document.getElementById("btn-ai-note");
  const oldText = btn.innerHTML;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> AI生成中...';
  btn.disabled = true;
  try{
    const resp = await fetch(`${data.aiConfig.baseUrl}/chat/completions`,{
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":`Bearer ${data.aiConfig.apiKey}` },
        body:JSON.stringify({
        model: data.aiConfig.model,
        messages:[
          {role:"system", content:`你是一名资深财务主管，专门把会计随手记的工作流水，重写成正式、专业、可直接交给领导看的日报工作描述。

【重写规则】
1. 把口语化流水账改成书面语，突出"做了什么+结果如何"，不要只改标点
2. 主动补充逻辑连接词，让前后动作连贯（如"先后完成""针对...问题""经核对"）
3. 把零散事项合并归类，同类工作用一句话概括，不要逐条罗列
4. 用专业财务术语（如"账务核对""结算流程""数据校验""异常处理"），但不要生造
5. 不添加不存在的事实，不夸大成果，不改变原意
6. 字数控制在80-200字之间，一段话写完，不要分点
7. 直接输出重写后的文本，不要任何解释、不要"优化如下"之类的话

【示例】
草稿：今天调了格林酒店的账，又录了几个新合同，然后导出了费用计算表看差异，有几家不对，我改了
重写：完成加盟店账务调整及合同录入维护工作，同步导出费用计算表进行差异核对，针对发现的异常数据逐项修正，确保账务数据准确。

草稿：催了几家酒店回款，打了电话也发了消息，还有两笔没回
重写：跟进加盟店回款进度，通过电话及消息方式催促未回款酒店，目前仍有两笔款项待跟进，已记录并安排次日继续催收。`},
          {role:"user", content: txt}
        ],
        temperature: 0.7,
        max_tokens: 500
      })
    });
    const result = await resp.json();
    if(result.choices && result.choices[0] && result.choices[0].message){
      showAiOptimizeModal(txt, result.choices[0].message.content.trim(), inp);
    }else{
      alert("❌AI返回结果异常："+JSON.stringify(result));
    }
  }catch(e){
    alert("❌调用AI失败："+e.message);
  }finally{
    btn.innerHTML = oldText;
    btn.disabled = false;
  }
}

async function doRegister(){
  const un = document.getElementById("reg-user").value.trim();

  const em = document.getElementById("reg-email").value.trim();
  const tip = document.getElementById("reg-tip");
  tip.innerText = "";

    tip.innerText = "账号必须是至少2个中文字（如：张三）";
    return;
  }
  // 密码
  if(!pw || pw.length < 4){
    tip.innerText = "密码不能少于4位";
    return;
  }
  // 邮箱格式
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){
    tip.innerText = "邮箱格式不正确";
    return;
  }
  // 账号是否已存在
  if(data.users.find(u=>u.username===un)){
    tip.innerText = "该账号已被注册";
    return;
  }

  // 创建新用户
  const newUser = {
    username: un,
    pwd: pw,
    email: em,
    isAdmin: false,
    permissions: {},
    createdAt: new Date().toISOString()
  };
  data.users.push(newUser);

  // 自动发欢迎邮件
  if(data.mailConfig?.publicKey && em){
    try{
      emailjs.init(data.mailConfig.publicKey);

        to_email: em,
        to_name: un,

        from_name: "一页清单系统"
      });
    }catch(e){
      console.log("欢迎邮件发送失败：", e);
    }
  }

  // 自动登录
  currentUser = newUser;
  if(!currentUser.permissions) currentUser.permissions = {};
  localStorage.setItem("_logged_user", un);
  document.querySelectorAll(".modal-overlay").forEach(m=>m.remove());
  showMainPage();
}

function renderAdminMailSelect(){
  const sel = document.getElementById("selectMemberForMail");

  normalUsers.forEach(u=>{
    sel.innerHTML += `<option value="${esc(u.username)}">${esc(u.username)}【邮箱：${esc(u.email||"未绑定邮箱")}】</option>`;
  });
  sel.onchange = function(){
    const selectedUser = this.value;
    if(!selectedUser) return;
    const userTodos = data.todos.filter(t=>t.assignTo === selectedUser);
    const waitTodos = userTodos.filter(t=>t.status === "wait");
    const doingTodos = userTodos.filter(t=>t.status === "doing");
    const finishTodos = userTodos.filter(t=>t.status === "finish");
    let mailContent = `您好 ${selectedUser}：\n\n您当前的待办任务汇总如下：\n\n`;
    const fmtP = p => p==="high"?"高优先级":p==="mid"?"中优先级":"低优先级";
    if(waitTodos.length){
      mailContent += `【未开始（${waitTodos.length}项）】\n`;
      waitTodos.forEach((t,i)=>{ mailContent += `${i+1}. [${t.category}] ${t.title}（${fmtP(t.priority)}）\n`; });
      mailContent += "\n";
    }
    if(doingTodos.length){
      mailContent += `【进行中（${doingTodos.length}项）】\n`;
      doingTodos.forEach((t,i)=>{ mailContent += `${i+1}. [${t.category}] ${t.title}（${fmtP(t.priority)}）\n`; });
      mailContent += "\n";
    }
    if(finishTodos.length){
      mailContent += `【已完成（${finishTodos.length}项）】\n`;
      finishTodos.forEach((t,i)=>{ mailContent += `${i+1}. [${t.category}] ${t.title}\n`; });

function addTodo(){
  const category = _selectedWorkItem ? _selectedWorkItem.name : "";
  const title = category; // 自动用工作项名作为待办标题
  const workRow = _selectedWorkItem ? _selectedWorkItem.row : null;
  const priority = document.getElementById("todo-priority").value;
  const status = document.getElementById("todo-status").value;
  const note = document.getElementById("todo-note").value.trim();
  let st = document.getElementById("todo-start").value.trim();
  if(!st && !window._editingTodoId && status === "doing") st = getNowTimeStr(); // 只有"进行中"才自动填开始时间
  const et = document.getElementById("todo-end").value.trim();
  const assignTarget = document.getElementById("assign-user")?.value || "";
  let useMin = null;
  const t1=parseTime(st), t2=parseTime(et);
  if(!isNaN(t1)&&!isNaN(t2)){
    if(t2<t1){ alert("完成时间不能早于开始时间"); return; }
    useMin = Math.round((t2-t1)/60000);
  }
  if(!category){ alert("请选择工作事项"); return; }
  
  // 编辑模式
  if(window._editingTodoId){
    const todo = data.todos.find(t=>Number(t.id)===window._editingTodoId);
    if(todo){
      todo.title=title; todo.category=category; todo.priority=priority; todo.status=status;
      todo.note=note; todo.startTime=st; todo.endTime=et; todo.useMin=useMin; todo.workRow=workRow;
      saveData();
      alert("✅待办修改已保存");
      cancelEdit();
      renderTodoList();
      return;
    }
  }
  // 批量下发
  if(currentUser.isAdmin && assignTarget === "__all__"){
    data.users.filter(u=>!u.isAdmin).forEach(m=>{
      data.todos.unshift({ id:genTodoId(), createUser:currentUser.username, assignTo:m.username, title,category,priority,status,note,startTime:st,endTime:et,useMin,workRow });
    });
    saveData(); alert("✅任务批量下发全部普通成员"); renderTodoList(); return;
  }
  const assignTo = (currentUser.isAdmin && assignTarget) ? assignTarget : currentUser.username;
  data.todos.unshift({ id:genTodoId(), createUser:currentUser.username, assignTo, title,category,priority,status,note,startTime:st,endTime:et,useMin,workRow });
  saveData();
  alert(`新增待办【${title}】`);
  ["todo-note","todo-start","todo-end"].forEach(id=>document.getElementById(id).value="");
  setSelectedWorkItem(null);
  _selectedPriority = "mid";
  document.getElementById("todo-priority").value = "mid";
  document.getElementById("priority-select-text").textContent = "🟠 中优先级";
  renderTodoList();
}
document.getElementById("btn-add-todo").onclick = addTodo;

// ============ 渲染待办列表 ============
function renderTodoList(){
  const wrap = document.getElementById("todo-list");
  const summaryWrap = document.getElementById("summary-list");

  // 日期选择器：默认不填，显示全部；选了日期才筛选
  const dateInput = document.getElementById("filter-date");
  const todayStr = new Date().toISOString().slice(0,10);

  let list = data.todos;
  if(!currentUser.isAdmin && !hasPermission(PERM.viewAllTodo)){
    list = list.filter(item=>item.assignTo === currentUser.username);
  }

  // 按日期筛选：不选日期显示全部；选了日期显示那天开始的 + 所有未完成/已逾期的
  const filterDateVal = document.getElementById("filter-date").value;
  if(filterDateVal){
    const dStart = new Date(filterDateVal + "T00:00:00").getTime();
    const dEnd = dStart + 86400000;
    list = list.filter(x=>{
      // 1. 那天开始的待办
      if(x.startTime){
        const st = parseTime(x.startTime);
        if(st >= dStart && st < dEnd) return true;
      }
      // 2. 所有未完成的待办（不管哪天开始）都显示
      if(x.status !== "finish") return true;
      return false;
    });
  }

  const todayStart = new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate()).getTime();

  // 下拉框筛选
  if(filterStatusVal) list = list.filter(x=>{
    if(filterStatusVal === "wait") return x.status === "wait";
    if(filterStatusVal === "doing") return x.status === "doing";
    if(filterStatusVal === "finish") return x.status === "finish";
    if(filterStatusVal === "overdue") return isItemOverdue(x);
    return true;
  });
  const filterPriorityVal = document.getElementById("filter-priority").value;
  if(filterPriorityVal) list = list.filter(x=>x.priority===filterPriorityVal);
  if(filterCatVal) list = list.filter(x=>x.category===filterCatVal);

  // 统计卡片点击筛选
  if(window._statFilter === "finish") list = list.filter(x=>x.status==="finish");
  if(window._statFilter === "doing") list = list.filter(x=>x.status==="doing" || x.status==="wait");
  if(window._statFilter === "overdue") list = list.filter(x=>isItemOverdue(x));

  const totalCount = list.length;
  const finishCount = list.filter(x=>x.status==="finish").length;
  const doingCount = list.filter(x=>x.status==="doing" || x.status==="wait").length;
  const overdueCount = list.filter(x=>isItemOverdue(x)).length;

  // 列表总时长
  const listMin = list.reduce((s,x)=>s+(x.useMin||0),0);
  const lh = Math.floor(listMin/60), lm = listMin%60;
  document.getElementById("list-total-min").textContent = list.length ? (lh>0?`⏱ ${lh}小时${lm}分钟`:`⏱ ${lm}分钟`) : "";

  let html = `<div class="stat-row">
    <div class="stat-card stat-total stat-filter-card" data-filter="all" style="cursor:pointer"><div class="label">总任务数</div><div class="num">${totalCount}</div></div>
    <div class="stat-card stat-doing stat-filter-card" data-filter="doing" style="cursor:pointer"><div class="label">待处理</div><div class="num">${doingCount}</div></div>
    <div class="stat-card stat-finish stat-filter-card" data-filter="finish" style="cursor:pointer"><div class="label">已完成</div><div class="num">${finishCount}</div></div>
    <div class="stat-card stat-overdue stat-filter-card" data-filter="overdue" style="cursor:pointer"><div class="label">已逾期</div><div class="num">${overdueCount}</div></div>
  </div>`;

  list.forEach(item=>{
    const priHtml = item.priority==="high"
      ?'<span class="priority-high"><i class="fa-solid fa-circle-up"></i> 🔴 高优先级</span>'
      :item.priority==="mid"
      ?'<span class="priority-mid"><i class="fa-solid fa-circle-minus"></i> 🟠 中优先级</span>'
      :'<span class="priority-low"><i class="fa-solid fa-circle-down"></i> 🟢 低优先级</span>';
    let statusHtml = item.status==="wait"
      ?'<span class="status-wait"><i class="fa-solid fa-pause"></i> 未开始</span>'
      :item.status==="doing"
      ?'<span class="status-doing"><i class="fa-solid fa-play"></i> 进行中</span>'
      :item.status==="paused"
      ?'<span class="status-paused"><i class="fa-solid fa-pause"></i> 已暂停</span>'
      :'<span class="status-finish"><i class="fa-solid fa-check"></i> 已完成</span>';
    let isOverdue = isItemOverdue(item);
    html += `
    <div class="todo-item ${isOverdue?'overdue':''}">
      <div class="todo-title">
        <strong>${esc(item.title)}</strong>${priHtml}${statusHtml}
        <span class="category-tag"><i class="fa-solid fa-tag"></i> ${esc(item.category)}</span>
        ${item.assignTo !== currentUser.username ? `<span style="background:#dbeafe;padding:6px 8px;border-radius:10px;font-size:12px">指派给：${esc(item.assignTo)}</span>` : ''}
      </div>
      <div style="color:#475569;line-height:1.7;white-space:pre-wrap">备注：${esc(item.note || "")}</div>
      <div class="meta-row">
        <span><i class="fa-regular fa-clock"></i> 开始：${esc(item.startTime||"-")}</span>
        <span><i class="fa-regular fa-clock"></i> 完成：${esc(item.endTime||"-")}</span>
        <span><i class="fa-solid fa-hourglass-half"></i> 用时：${item.useMin ? item.useMin+"分钟":"-"}</span>
      </div>
      <div class="todo-actions">
        ${item.status==="wait"?`<button class="btn-primary btn-start-todo" data-id="${item.id}"><i class="fa-solid fa-play"></i> 开始</button>`:""}
        ${item.status==="doing"?`<button class="btn-warning btn-pause-todo" data-id="${item.id}"><i class="fa-solid fa-pause"></i> 暂停</button>`:""}
        ${item.status==="doing"?`<button class="btn-success btn-complete-todo" data-id="${item.id}"><i class="fa-solid fa-check"></i> 完成</button>`:""}
        ${item.status==="paused"?`<button class="btn-primary btn-resume-todo" data-id="${item.id}"><i class="fa-solid fa-play"></i> 继续</button>`:""}
        ${item.status==="paused"?`<button class="btn-success btn-complete-todo" data-id="${item.id}"><i class="fa-solid fa-check"></i> 完成</button>`:""}
        <button class="btn-gray btn-edit-todo" data-id="${item.id}"><i class="fa-solid fa-pen"></i> 编辑</button>
        <button class="btn-danger btn-del-todo" data-id="${item.id}"><i class="fa-solid fa-trash"></i> 删除</button>
      </div>
    </div>`;
  });
  wrap.innerHTML = html || "<div>暂无待办</div>";

  const group = {};
  list.forEach(t=>{
    if(!group[t.category]) group[t.category] = {count:0,totalMin:0};
    group[t.category].count++;
    if(t.useMin) group[t.category].totalMin += t.useMin;
  });
  let sumHtml = "";
  let grandTotalMin = 0;
  Object.keys(group).forEach(cat=>{
    grandTotalMin += group[cat].totalMin;
    sumHtml += `<div class="summary-group"><strong>${esc(cat)}</strong><br/>任务数量：${group[cat].count} | 总耗时：${group[cat].totalMin}分钟</div>`;
  });
  // 显示总时长
  const h = Math.floor(grandTotalMin/60);
  const m = grandTotalMin%60;
  const totalText = h>0 ? `⏱ 共 ${h}小时${m}分钟` : `⏱ 共 ${m}分钟`;
  document.getElementById("total-min-display").textContent = list.length ? totalText : "";
  summaryWrap.innerHTML = sumHtml || "<div>暂无数据汇总</div>";
}

  if(!confirm("确认要给所有有未完成任务的成员批量发送提醒邮件吗？")) return;
  let successCount=0, failCount=0, skipCount=0;
  const fmtP = p => p==="high"?"高优先级":p==="mid"?"中优先级":"低优先级";
  for(const member of members){
    const unfinished = data.todos.filter(t=>t.assignTo===member.username && t.status!=="finish");
    if(!unfinished.length){ skipCount++; continue; }
    const waitTodos = unfinished.filter(t=>t.status==="wait");
    const doingTodos = unfinished.filter(t=>t.status==="doing");
    let mailContent = `您好 ${member.username}：\n\n您有${unfinished.length}项未完成的待办任务，请及时处理：\n\n`;
    if(waitTodos.length){
      mailContent += `【未开始（${waitTodos.length}项）】\n`;
      waitTodos.forEach((t,i)=>{ mailContent += `${i+1}. [${t.category}] ${t.title}\n`; });
      mailContent += "\n";
    }
    if(doingTodos.length){
      mailContent += `【进行中（${doingTodos.length}项）】\n`;
      doingTodos.forEach((t,i)=>{ mailContent += `${i+1}. [${t.category}] ${t.title}\n`; });
      mailContent += "\n";
    }
    mailContent += "请尽快跟进，逾期任务会自动标红提醒。\n—— 一页清单系统自动发送";
    try{
      await sendMail(member.email, "一页清单 - 待办任务提醒", mailContent);
      successCount++;
      data.mailLogs.push({time:getNowTimeStr(),to:member.email,status:"success",msg:`批量提醒发送给${member.username}，未完成任务${unfinished.length}项`});
    }catch(e){
      failCount++;
      data.mailLogs.push({time:getNowTimeStr(),to:member.email,status:"fail",msg:`批量提醒发送给${member.username}失败：${e.message}`});
    }
  }
  saveData(); renderMailLog();
  alert(`✅批量提醒完成\n成功发送：${successCount}人\n无待办跳过：${skipCount}人\n发送失败：${failCount}人`);
};

document.getElementById("btn-export-backup").onclick = ()=>{
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const now = new Date();
  const dateStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}`;
  a.href = url; a.download = `一页清单备份_${dateStr}.json`; a.click();
  URL.revokeObjectURL(url);
  alert("✅备份文件已下载，换电脑时导入这个文件即可恢复所有数据");
};
document.getElementById("btn-import-backup").onclick = ()=>document.getElementById("import-backup-file").click();
document.getElementById("import-backup-file").onchange = function(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const importData = JSON.parse(ev.target.result);
      if(!importData.users || !importData.categories){ alert("❌备份文件格式不正确"); return; }
      if(!confirm("⚠️导入备份会覆盖当前所有数据，确认继续吗？")) return;
      data = importData;
      if(!data.mailConfig) data.mailConfig = {serviceId:"", templateId:"", publicKey:""};
      if(!data.mailLogs) data.mailLogs = [];
      saveData();
      alert("✅备份导入成功，页面即将刷新");
      setTimeout(()=>location.reload(), 1000);
    }catch(err){ alert("❌备份文件解析失败："+err.message); }
  };
  reader.readAsText(file);
};

document.getElementById("btn-export").onclick = ()=>{
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth()+1).padStart(2,"0");
  const dd = String(today.getDate()).padStart(2,"0");
  const defaultDate = `${yyyy}-${mm}-${dd}`;

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay show";
  overlay.innerHTML = `
    <div class="modal-box">
      <h3><i class="fa-solid fa-calendar-days"></i> 选择要导出的日期</h3>
      <div class="form-item" style="margin-top:16px">
        <label>日期</label>
        <input type="date" id="export-date-picker" value="${defaultDate}" />
      </div>
      <div id="export-preview" style="font-size:13px;color:#64748b;margin:10px 0"></div>
      <div style="text-align:right;margin-top:16px">
        <button class="btn-gray act-cancel">取消</button>
        <button class="btn-primary act-confirm"><i class="fa-solid fa-download"></i> 导出日报</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const dateInput = overlay.querySelector("#export-date-picker");
  const preview = overlay.querySelector("#export-preview");

  function updatePreview(){
    const dateStr = dateInput.value;
    if(!dateStr){ preview.textContent=""; return; }
    const list = filterTodosByDate(dateStr);
    preview.innerHTML = `当天共 <b>${list.length}</b> 条待办` +
      (list.length? "：" + list.map(t=>esc(t.title)).join("、") : "（无待办记录）");
  }
  dateInput.addEventListener("change", updatePreview);
  updatePreview();

  overlay.querySelector(".act-cancel").onclick = ()=>overlay.remove();
  overlay.querySelector(".act-confirm").onclick = ()=>{
    const dateStr = dateInput.value;
    if(!dateStr){ alert("请选择日期"); return; }
    exportDailyReport(dateStr);
    overlay.remove();
  };
};

function filterTodosByDate(dateStr){
  const target = dateStr.replace(/-/g,"/");
  let list = data.todos;
  if(!currentUser.isAdmin && !hasPermission(PERM.viewAllTodo)){
    list = list.filter(t=>t.assignTo === currentUser.username);
  }
  return list.filter(t=>{
    const st = (t.startTime||"").substring(0,10);
    const et = (t.endTime||"").substring(0,10);
    return st === target || et === target;
  });
}

function exportDailyReport(dateStr){
  try{
    const wb = XLSX.read(DAILY_REPORT_TEMPLATE_B64, {type:"base64"});
    const ws = wb.Sheets["Sheet1"];

    const list = filterTodosByDate(dateStr);
    const rowData = {};

    list.forEach(t=>{
      const row = t.workRow || 33;
      if(!rowData[row]) rowData[row] = {plan:0, done:0, totalMin:0, notes:[]};
      rowData[row].plan++;
      if(t.status === "finish") rowData[row].done++;
      if(t.useMin) rowData[row].totalMin += t.useMin;
      const noteText = t.note || t.title || "";
      if(noteText) rowData[row].notes.push(noteText);
    });

    // E=计划量, F=完成量, H=实际时长(小时), K=备注；G/I/J公式保留
    Object.keys(rowData).forEach(r=>{
      const row = Number(r);
      const d = rowData[r];
      const hours = Math.round(d.totalMin/60*100)/100;
      XLSX.utils.sheet_add_aoa(ws, [[d.plan, d.done, undefined, hours, undefined, undefined, d.notes.join("\n")]], {origin: `E${row}`});
    });

    XLSX.utils.sheet_add_aoa(ws, [[dateStr]], {origin: "D1"});

    const wbout = XLSX.write(wb, {bookType:"xlsx", type:"array"});
    const blob = new Blob([wbout], {type:"application/octet-stream"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `日报_${dateStr}.xlsx`;
    a.click();
    URL.revokeObjectURL(url);
    alert("✅日报已导出："+`日报_${dateStr}.xlsx`);
  }catch(e){
    alert("❌导出失败："+e.message);
    console.error(e);
  }
};
